<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/ext/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body {
    font-family: 'DM Sans', sans-serif;
    display: grid; grid-template-columns: 470px 1fr; align-items: center;
    padding: 0 72px 0 80px; gap: 40px;
    --ink: #F4F1F5; --muted: #A9A6BC; --accent: #FB7185;
    background:
      radial-gradient(900px 600px at 82% 30%, rgba(251,113,133,.20), transparent 60%),
      radial-gradient(700px 500px at 10% 100%, rgba(190,18,60,.18), transparent 60%),
      #13131B;
  }
  body.light {
    --ink: #1F1B24; --muted: #5E5868; --accent: #BE123C;
    background:
      radial-gradient(900px 600px at 82% 30%, rgba(251,113,133,.22), transparent 60%),
      radial-gradient(700px 500px at 10% 100%, rgba(190,18,60,.10), transparent 60%),
      #F6F1EC;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 36px; }
  .brand img { width: 44px; height: 44px; }
  .brand span { font-size: 22px; font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
  h1 { font-size: 46px; line-height: 1.1; font-weight: 700; color: var(--ink); letter-spacing: -.02em; margin-bottom: 22px; }
  h1 em { font-style: normal; color: var(--accent); }
  p.sub { font-size: 20px; line-height: 1.5; color: var(--muted); }
  .stage { display: flex; justify-content: center; align-items: center; height: 800px; }
  .panel {
    border-radius: 14px; overflow: hidden; transform-origin: center;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
  }
  body.light .panel { box-shadow: 0 30px 70px rgba(80,30,50,.22), 0 0 0 1px rgba(0,0,0,.08); }
  iframe { display: block; border: 0; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="/ext/icons/icon.svg" alt=""><span>Hayatab</span></div>
    <h1 id="h"></h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="stage"><div class="panel" id="panel"><iframe id="f"></iframe></div></div>
</body>
</html>
